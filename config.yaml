# ══════════════════════════════════════════════════════════════════════
# ПРАВИЛА
#
# ПОРЯДОК ЗНАЧИМ: побеждает первое совпадение, остальные не проверяются.
# Узкое правило должно стоять выше широкого, иначе широкое его перекроет
# (так nintendo-домены больше года уходили в Community вместо Nintendo).
#
# Проверить порядок и ссылки: ruby scripts/validate.rb
# ══════════════════════════════════════════════════════════════════════
rules:
  # Первым правилом: туннель до своего узла идёт напрямую. Иначе соединение
  # телефона к узлу поехало бы внутри чужого подписочного прокси — лишний
  # крюк, лишняя задержка и ещё одна точка отказа. no-resolve — адрес и так
  # известен, DNS для него не нужен.
  - IP-CIDR,${NODE_S_IP}/32,DIRECT,no-resolve
  - AND,((DST-PORT,443),(NETWORK,UDP)),QUIC
  - OR,((DOMAIN-SUFFIX,gql.twitch.tv),(DOMAIN-SUFFIX,usher.ttvnw.net)),Свободный интернет # Разблокировка высокого качества на Twitch.tv
  # Вся сессия Google — одним выходом.
  #
  # Gemini сверяет страну не по одному запросу, а по сессии целиком. Пока
  # домены расходились по группам, браузер уходил в Google через четыре узла
  # в трёх странах разом (проверено захватом 26.08.2026: gemini — Нидерланды,
  # www.google.com — Польша, play/photos — Латвия, lh3.googleusercontent.com —
  # заблокированный nv 1 через группу YouTube). Google считал такую сессию
  # несогласованной и возвращал заглушку про страну уже после загрузки чата.
  #
  # Правила Google стоят ВЫШЕ правил остальных AI намеренно: и
  # GEOSITE,category-ai-!cn, и RULE-SET,AI-custom содержат gemini.google.com,
  # accounts.google.com, gstatic.com и бэкенд alkali…clients6. Стой они выше,
  # домены Gemini ушли бы в группу AI, к Claude и ChatGPT, — то есть на узел,
  # который Google почти наверняка считает российским.
  #
  # YouTube выше Google: видеотрафик остаётся на своей группе и не утягивается
  # на узел Google. googleusercontent.com здесь намеренно НЕ упомянут —
  # аватарки нужны в сессии Google, их забирает правило ниже.
  - GEOSITE,youtube,YouTube
  - GEOSITE,google,Google
  - OR,((DOMAIN-SUFFIX,clients6.google.com),(DOMAIN-SUFFIX,ogs.google.com)),Google
  # Остальные AI: Claude, ChatGPT и прочие. Домены Google сюда уже не дойдут —
  # их забрали правила выше.
  - GEOSITE,category-ai-!cn,AI
  - RULE-SET,AI-custom,AI
  - GEOSITE,spotify,Spotify
  - GEOSITE,twitch,Twitch
  - GEOSITE,twitter,Twitter
  - RULE-SET,discord,Discord
  - OR,((GEOSITE,meta),(RULE-SET,meta-ips,no-resolve)),Meta
  - RULE-SET,microsoft,Microsoft
  - OR,((GEOSITE,telegram),(RULE-SET,telegram-ips,no-resolve)),Telegram
  - OR,((GEOSITE,cloudflare),(RULE-SET,cloudflare-ips)),Cloudflare
  - RULE-SET,kino,Кинотеатры
  - IP-CIDR,172.235.195.23/32,Nintendo,no-resolve
  - RULE-SET,nintendo,Nintendo
  - RULE-SET,community,Community
  - RULE-SET,tiktok,TikTok
  - RULE-SET,patreon,Свободный интернет
  - RULE-SET,playstation,PlayStation
  - RULE-SET,lg,LG
  - RULE-SET,tcl,TCL
  - RULE-SET,steam-chat,Steam (чат и голос)
  - RULE-SET,steam,Steam
  - RULE-SET,epicgames,Epic Games
  - RULE-SET,ea,EA
  - RULE-SET,ubisoft,Ubisoft
  - RULE-SET,mihoyo,Mihoyo
  - RULE-SET,games-proxy,Игры (прокси)
  - RULE-SET,others,OTHERS
  - RULE-SET,refilter-domains,Свободный интернет
  - RULE-SET,refilter-ips,Свободный интернет
  - RULE-SET,torrent-clients,DIRECT
  - RULE-SET,torrent-trackers,DIRECT
  - MATCH,DIRECT
