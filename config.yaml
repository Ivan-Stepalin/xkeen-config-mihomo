log-level: silent
allow-lan: true
redir-port: 1080
tproxy-port: 1081
ipv6: false
mode: rule
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
external-controller: 0.0.0.0:9090
external-ui: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

# ══════════════════════════════════════════════════════════════════════
# ШАБЛОНЫ
#
# Ключ x-templates mihomo не читает — он существует только как источник
# YAML-якорей для блоков ниже. Повторяющиеся поля описаны здесь один раз,
# а группы и rule-provider'ы подключают их через merge-ключ `<<: *якорь`.
# Любое поле после `<<:` переопределяет унаследованное значение.
#
# Как добавить группу:      см. комментарий над proxy-groups
# Как добавить rule-provider: см. комментарий над rule-providers
# ══════════════════════════════════════════════════════════════════════
x-templates:
  # Группа: узлы из подписки + ручной выбор запасных вариантов.
  select: &select
    type: select
    use: [subscription]
    proxies: [Свободный интернет, DIRECT]

  # rule-provider: скомпилированный .mrs со списком доменов.
  mrs-domain: &mrs-domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400

  # rule-provider: скомпилированный .mrs со списком IP-подсетей.
  mrs-ipcidr: &mrs-ipcidr
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

  # rule-provider: .yaml, плоский список доменов (payload: - example.com).
  yaml-domain: &yaml-domain
    type: http
    behavior: domain
    format: yaml
    interval: 86400

  # rule-provider: .yaml, полноценные правила (payload: - DOMAIN-SUFFIX,…).
  yaml-classical: &yaml-classical
    type: http
    behavior: classical
    format: yaml
    interval: 86400

  # rule-provider: правила прямо в этом файле, без загрузки.
  inline: &inline
    type: inline
    behavior: classical
    format: text

# ══════════════════════════════════════════════════════════════════════
# ГРУППЫ
#
# Новая группа — три строки:
#
#   - <<: *select
#     name: Название
#     icon: https://…/icon.png
#
# Название затем указывается как цель правила в блоке rules.
# Чтобы изменить список запасных вариантов, допишите своё поле proxies —
# оно перекроет значение из шаблона (пример: Cloudflare ниже).
# ══════════════════════════════════════════════════════════════════════
proxy-groups:
  # Автовыбор быстрейшего узла подписки. Используется как «прокси по
  # умолчанию» в шаблоне *select, поэтому объявлен первым.
  - name: Свободный интернет
    type: url-test
    url: http://www.msftncsi.com/ncsi.txt
    interval: 120
    tolerance: 50
    lazy: false
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png
    include-all: true

  - <<: *select
    name: YouTube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png

  - <<: *select
    name: Discord
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png

  - <<: *select
    name: Twitch
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png

  - <<: *select
    name: Кинотеатры
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/kino.png

  - <<: *select
    name: Meta
    icon: https://github.com/zxc-rv/assets/raw/refs/heads/main/group-icons/meta.png

  - <<: *select
    name: Microsoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png

  - <<: *select
    name: Spotify
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png

  - <<: *select
    name: Telegram
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png

  - <<: *select
    name: Community
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/community.png

  # PASS — передать решение следующему правилу вместо отправки в прокси.
  - <<: *select
    name: Cloudflare
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Cloudflare.png
    proxies: [PASS, Свободный интернет, DIRECT]

  - <<: *select
    name: AI
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png

  - <<: *select
    name: Twitter
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png

  - <<: *select
    name: TikTok
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/tiktok.png

  - <<: *select
    name: PlayStation
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/PlayStation.png

  - <<: *select
    name: Nintendo
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Nintendo.png

  - <<: *select
    name: LG
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_TV.png

  - <<: *select
    name: TCL
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_TV.png

  - <<: *select
    name: Steam
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png

  - <<: *select
    name: Steam (чат и голос)
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png

  - <<: *select
    name: Epic Games
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Epic_Games.png

  - <<: *select
    name: EA
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: Ubisoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: Mihoyo
    icon: https://raw.githubusercontent.com/clash-verge-rev/icon-hub/main/mihoyo/ys.png

  - <<: *select
    name: Игры (прокси)
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: OTHERS
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  # Служебная группа: глушит QUIC, чтобы трафик откатился на TLS.
  # Без `use`, поэтому шаблон *select не подходит.
  - name: QUIC
    type: select
    icon: https://github.com/zxc-rv/assets/raw/refs/heads/main/group-icons/quic.png
    proxies: [REJECT, PASS]

# Подключение с использованием подписки
proxy-providers:
  subscription:
    type: http
    url:  ${SUB_A}# <------------ ЗДЕСЬ ВСТАВИТЬ ССЫЛКУ НА ВАШУ ПОДПИСКУ
    path: ./proxy-providers/subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.msftncsi.com/ncsi.txt
      interval: 120

# ══════════════════════════════════════════════════════════════════════
# RULE-PROVIDER'Ы
#
# Новый провайдер — четыре строки (шаблон задаёт type/behavior/format/interval):
#
#   имя:
#     <<: *mrs-domain
#     url: https://…/что-то.mrs
#     path: ./rule-providers/что-то.mrs
#
# Шаблон выбирается по формату источника:
#   *mrs-domain      .mrs со списком доменов
#   *mrs-ipcidr      .mrs со списком IP-подсетей
#   *yaml-domain     .yaml, плоский список доменов
#   *yaml-classical  .yaml с готовыми правилами
#   *inline          правила прямо здесь, в payload
#
# Имя провайдера — то, что пишется в RULE-SET,<имя>,<группа>.
# ══════════════════════════════════════════════════════════════════════
rule-providers:
  # ── Собственные списки из этого репозитория ───────────────────────
  # Правятся в rules/*.yaml, роутер подтягивает их с raw.githubusercontent.
  # После push изменения приезжают в течение interval (сутки).
  kino:
    <<: *yaml-domain
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/kino.yaml
    path: ./rule-providers/kino-domains.yaml

  AI-custom:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/AI.yaml
    path: ./rule-providers/ai-custom.yaml

  lg:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/lg.yaml
    path: ./rule-providers/lg.yaml

  tcl:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/tcl.yaml
    path: ./rule-providers/tcl.yaml

  mihoyo:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/mihoyo.yaml
    path: ./rule-providers/mihoyo.yaml

  others:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/others.yaml
    path: ./rule-providers/others.yaml

  games-proxy:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/games-proxy.yaml
    path: ./rule-providers/games-proxy.yaml

  # ВНИМАНИЕ: тянется .mrs, а не rules/community.yaml — правки в yaml
  # ни на что не влияют, пока источник не переведён на format: yaml.
  # Подробнее: scripts/validate.rb предупреждает об этом рассинхроне.
  community:
    <<: *mrs-domain
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/community.mrs
    path: ./rule-providers/community-domains.mrs

  # ── geosite от MetaCubeX ──────────────────────────────────────────
  patreon:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/patreon.mrs
    path: ./rule-providers/patreon-domains.mrs

  tiktok:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/tiktok.mrs
    path: ./rule-providers/tiktok-domains.mrs

  microsoft:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/microsoft.mrs
    path: ./rule-providers/microsoft-domains.mrs

  playstation:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/playstation.mrs
    path: ./rule-providers/playstation-domains.mrs

  nintendo:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/nintendo.mrs
    path: ./rule-providers/nintendo-domains.mrs

  steam:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/steam.mrs
    path: ./rule-providers/steam-domains.mrs

  epicgames:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/epicgames.mrs
    path: ./rule-providers/epicgames-domains.mrs

  ea:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/ea.mrs
    path: ./rule-providers/ea-domains.mrs

  ubisoft:
    <<: *mrs-domain
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/ubisoft.mrs
    path: ./rule-providers/ubisoft-domains.mrs

  # ── geoip от MetaCubeX и сторонние IP-списки ──────────────────────
  cloudflare-ips:
    <<: *mrs-ipcidr
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cloudflare.mrs
    path: ./rule-providers/cloudflare-ips.mrs

  telegram-ips:
    <<: *mrs-ipcidr
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/telegram.mrs
    path: ./rule-providers/telegram-ips.mrs

  meta-ips:
    <<: *mrs-ipcidr
    url: https://github.com/zxc-rv/assets/raw/refs/heads/main/rules/meta-ips.mrs
    path: ./rule-providers/meta-ips.mrs

  # ── re:filter (реестр РКН) и торренты, legiz-ru ───────────────────
  refilter-domains:
    <<: *mrs-domain
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/domain-rule.mrs
    path: ./rule-providers/refilter-domains.mrs

  refilter-ips:
    <<: *mrs-ipcidr
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/ip-rule.mrs
    path: ./rule-providers/refilter-ips.mrs

  torrent-trackers:
    <<: *mrs-domain
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/torrent-trackers.mrs
    path: ./rule-providers/torrent-trackers.mrs

  torrent-clients:
    <<: *yaml-classical
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/torrent-clients.yaml
    path: ./rule-providers/torrent-clients.yaml

  # ── Правила, заданные прямо здесь ─────────────────────────────────
  steam-chat:
    <<: *inline
    payload:
      - DOMAIN-SUFFIX,steamcommunity.com
      - DOMAIN-SUFFIX,steam-chat.com

  discord:
    <<: *inline
    payload:
      - AND,((DOMAIN-KEYWORD,discord),(NOT,((DOMAIN-SUFFIX,ru))))
      - AND,((RULE-SET,cloudflare-ips,no-resolve),(NETWORK,TCP),(OR,((DST-PORT,2000-2300),(DST-PORT,8443))))
      - AND,((RULE-SET,cloudflare-ips,no-resolve),(NETWORK,UDP),(OR,((DST-PORT,19200-19400),(DST-PORT,50000-51000))))
      - AND,((IP-CIDR,5.200.14.128/25,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,34.0.0.0/15,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,34.2.0.0/15,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,35.192.0.0/11,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,66.22.192.0/18,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,138.128.136.0/21,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))

# ══════════════════════════════════════════════════════════════════════
# ПРАВИЛА
#
# ПОРЯДОК ЗНАЧИМ: побеждает первое совпадение, остальные не проверяются.
# Узкое правило должно стоять выше широкого, иначе широкое его перекроет
# (так nintendo-домены больше года уходили в Community вместо Nintendo).
#
# Проверить порядок и ссылки: ruby scripts/validate.rb
# ══════════════════════════════════════════════════════════════════════
rules:
  - AND,((DST-PORT,443),(NETWORK,UDP)),QUIC
  - OR,((DOMAIN-SUFFIX,gql.twitch.tv),(DOMAIN-SUFFIX,usher.ttvnw.net)),Свободный интернет # Разблокировка высокого качества на Twitch.tv
  - GEOSITE,category-ai-!cn,AI
  - RULE-SET,AI-custom,AI
  - GEOSITE,spotify,Spotify
  - OR,((GEOSITE,youtube),(DOMAIN-SUFFIX,googleusercontent.com)),YouTube
  - GEOSITE,twitch,Twitch
  - GEOSITE,twitter,Twitter
  - RULE-SET,discord,Discord
  - OR,((GEOSITE,meta),(RULE-SET,meta-ips,no-resolve)),Meta
  - RULE-SET,microsoft,Microsoft
  - OR,((GEOSITE,telegram),(RULE-SET,telegram-ips,no-resolve)),Telegram
  - OR,((GEOSITE,cloudflare),(RULE-SET,cloudflare-ips)),Cloudflare
  - RULE-SET,kino,Кинотеатры
  - IP-CIDR,172.235.195.23/32,Nintendo,no-resolve
  - RULE-SET,nintendo,Nintendo
  - RULE-SET,community,Community
  - RULE-SET,tiktok,TikTok
  - RULE-SET,patreon,Свободный интернет
  - RULE-SET,playstation,PlayStation
  - RULE-SET,lg,LG
  - RULE-SET,tcl,TCL
  - RULE-SET,steam-chat,Steam (чат и голос)
  - RULE-SET,steam,Steam
  - RULE-SET,epicgames,Epic Games
  - RULE-SET,ea,EA
  - RULE-SET,ubisoft,Ubisoft
  - RULE-SET,mihoyo,Mihoyo
  - RULE-SET,games-proxy,Игры (прокси)
  - RULE-SET,others,OTHERS
  - RULE-SET,refilter-domains,Свободный интернет
  - RULE-SET,refilter-ips,Свободный интернет
  - RULE-SET,torrent-clients,DIRECT
  - RULE-SET,torrent-trackers,DIRECT
  - MATCH,DIRECT
