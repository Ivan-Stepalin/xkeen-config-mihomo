log-level: silent
allow-lan: true
redir-port: 1080
tproxy-port: 1081
ipv6: false
mode: rule

# Задержка мерится без первого рукопожатия: иначе url-test сравнивает узлы
# нечестно — у транспортов разная цена установки соединения, и XHTTP с Vision
# на одном и том же сервере давали бы разные числа при равной скорости.
unified-delay: true
# Соединение устанавливается ко всем адресам домена разом, побеждает первый
# ответивший. Заметно на доменах с записями в нескольких сетях.
tcp-concurrent: true
# Сопоставление трафика с процессами на роутере бессмысленно — трафик не
# локальный, — а процессор оно тратит. Выключено явно, а не по умолчанию.
find-process-mode: off
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
external-controller: 0.0.0.0:9090
external-ui: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  # Свой узел исключён из сниффинга. Иначе parse-pure-ip плюс TLS-сниффер на
  # 443 разбирают ClientHello соединения к голому IP узла, видят там SNI
  # www.samsung.com (маскировка Reality) и подменяют адресат на настоящий
  # www.samsung.com. Телефон или ноутбук в LAN, подключённый к узлу напрямую,
  # получает в ответ подлинный сертификат донора и падает с
  # «REALITY authentication failed» при исправном узле.
  # На сам роутер это не влияло: свои исходящие подключения он не сниффит.
  skip-dst-address:
    - ${NODE_S_IP}/32
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

# ══════════════════════════════════════════════════════════════════════
# ШАБЛОНЫ
#
# Ключ x-templates mihomo не читает — он существует только как источник
# YAML-якорей для блоков ниже. Повторяющиеся поля описаны здесь один раз,
# а группы и rule-provider'ы подключают их через merge-ключ `<<: *якорь`.
# Любое поле после `<<:` переопределяет унаследованное значение.
#
# Как добавить группу:      см. комментарий над proxy-groups
# Как добавить rule-provider: см. комментарий над rule-providers
# ══════════════════════════════════════════════════════════════════════
x-templates:
  # Группа: узлы обеих подписок + ручной выбор запасных вариантов.
  select: &select
    type: select
    use: [subscription]
    proxies: [Свой узел, Свободный интернет, Подписка, DIRECT]

  # Подписка: общие поля, различаются только url, path и префикс имён.
  provider: &provider
    type: http
    interval: 3600
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      expected-status: 204
      interval: 120

  # Группа: автовыбор быстрейшего узла внутри одной подписки.
  # Без lazy: false — узлы тестируются только когда группа реально выбрана,
  # иначе роутер гонял бы health-check по всем узлам обеих подписок втройне.
  sub-test: &sub-test
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    tolerance: 50

  # rule-provider: скомпилированный .mrs со списком доменов.
  mrs-domain: &mrs-domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400

  # rule-provider: скомпилированный .mrs со списком IP-подсетей.
  mrs-ipcidr: &mrs-ipcidr
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

  # rule-provider: .yaml, плоский список доменов (payload: - example.com).
  yaml-domain: &yaml-domain
    type: http
    behavior: domain
    format: yaml
    interval: 86400

  # rule-provider: .yaml, полноценные правила (payload: - DOMAIN-SUFFIX,…).
  yaml-classical: &yaml-classical
    type: http
    behavior: classical
    format: yaml
    interval: 86400

  # rule-provider: правила прямо в этом файле, без загрузки.
  inline: &inline
    type: inline
    behavior: classical
    format: text

# ══════════════════════════════════════════════════════════════════════
# ГРУППЫ
#
# Новая группа — три строки:
#
#   - <<: *select
#     name: Название
#     icon: https://…/icon.png
#
# Название затем указывается как цель правила в блоке rules.
# Чтобы изменить список запасных вариантов, допишите своё поле proxies —
# оно перекроет значение из шаблона (пример: Cloudflare ниже).
# ══════════════════════════════════════════════════════════════════════
# СВОЙ УЗЕЛ
#   Прописан здесь, а не подпиской: подписка с самого узла требовала на нём
#   nginx с настоящим доменом и сертификатом, а замер 27.08.2026 показал, что
#   честное имя в SNI душат на первом окне TCP. Весь тот слой снесён.
#
#   Два входа на одном сервере с РАЗНЫМИ донорами: если одно имя начнут
#   душить, второй вход продолжает работать. Проверено замером — оба отдают
#   10 МБ на 12-13 МБ/с, см. node/README.md.
#
#   Реквизиты подставляются smudge-фильтром из .secrets.yaml, в коммит уходят
#   плейсхолдеры. Обновляются командой ./node/bin/client show router.
# ══════════════════════════════════════════════════════════════════════
proxies:
  # Основной вход. XHTTP в режиме stream-one сворачивает обмен в один поток:
  # ТСПУ с июня 2026 морозит на 120 секунд всё, что открывает больше трёх
  # параллельных TLS к одному имени за 350-400 мс, а health-check группы
  # url-test делает ровно это.
  - name: Свой узел XHTTP
    type: vless
    server: ${NODE_S_IP}
    port: 443
    uuid: ${NODE_S_UUID}
    udp: true
    packet-encoding: xudp
    tls: true
    network: xhttp
    alpn: [h2]
    servername: www.samsung.com
    client-fingerprint: firefox
    reality-opts:
      public-key: ${NODE_S_PBK_X}
      short-id: ${NODE_S_SID_X}
    xhttp-opts:
      path: ${NODE_S_PATH}
      mode: stream-one

  # Запасной вход: классический Vision поверх сырого TCP. Именно эту связку
  # массово блокировали у проводных операторов РФ, поэтому она вторая, а не
  # первая — но на замере держится наравне.
  - name: Свой узел Vision
    type: vless
    server: ${NODE_S_IP}
    port: 2096
    uuid: ${NODE_S_UUID}
    udp: true
    packet-encoding: xudp
    tls: true
    flow: xtls-rprx-vision
    network: tcp
    servername: www.nvidia.com
    client-fingerprint: firefox
    reality-opts:
      public-key: ${NODE_S_PBK_V}
      short-id: ${NODE_S_SID_V}

# ══════════════════════════════════════════════════════════════════════
proxy-groups:
  # Свой VPS: автовыбор среди его транспортов. Смысл в том, что при блокировке
  # одного транспорта группа сама переходит на другой — узел один, путей до
  # него пять, и ТСПУ приходится ломать каждый отдельно.
  - name: Свой узел
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    tolerance: 100
    lazy: false
    proxies: [Свой узел XHTTP, Свой узел Vision]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  # Автовыбор быстрейшего узла подписки. Используется как «прокси по
  # умолчанию» в шаблоне *select, поэтому объявлен первым.
  - name: Свободный интернет
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    tolerance: 50
    lazy: false
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png
    # Только узлы подписки. Было include-all: true, а оно втягивает и узлы,
    # описанные в proxies: — то есть оба входа своего узла попадали в этот
    # автопул вторым путём, хотя «Свой узел» и так стоит первым вариантом в
    # каждой группе.
    include-all-providers: true
    # Семейство nv — самое быстрое, поэтому url-test выбирал именно его, и на
    # него садились все сервисы Google, кроме группы AI. Google блокирует эти
    # IP (петля GOOGLE_ABUSE), из-за чего Gemini падал на заглушку про страну
    # уже после загрузки страницы. Российские выходы исключены по той же
    # причине. Узлы остаются доступны для выбора вручную в любой группе.
    exclude-filter: "(?i)(nv [0-9]|\U0001F1F7\U0001F1FA)"

  # Автовыбор по подписке без изъятий. Отличается от «Свободного интернета»
  # тем, что не отбрасывает семейство nv и российские выходы — нужен, когда
  # надо дотянуться именно до них, не выбирая узел руками.
  - <<: *sub-test
    name: Подписка
    use: [subscription]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  - <<: *select
    name: YouTube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png

  - <<: *select
    name: Discord
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png

  - <<: *select
    name: Twitch
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitch.png

  - <<: *select
    name: Кинотеатры
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/kino.png

  - <<: *select
    name: Meta
    icon: https://github.com/zxc-rv/assets/raw/refs/heads/main/group-icons/meta.png

  - <<: *select
    name: Microsoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png

  - <<: *select
    name: Spotify
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png

  - <<: *select
    name: Telegram
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png

  - <<: *select
    name: Community
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/community.png

  # PASS — передать решение следующему правилу вместо отправки в прокси.
  - <<: *select
    name: Cloudflare
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Cloudflare.png
    proxies: [PASS, Свой узел, Свободный интернет, Подписка, DIRECT]

  # У Google и у остальных AI-сервисов требования к выходу разные и
  # несовместимые, поэтому групп две, а не одна.
  #
  # Google определяет страну по своей гео-базе, а не по тому, где физически
  # стоит сервер, и почти всю подписку считает российской. Для Gemini это
  # заглушка «не поддерживается в вашей стране». Годных узлов единицы, и
  # список приходится держать руками (см. Google-выход ниже).
  #
  # Claude, ChatGPT и прочим достаточно любого быстрого нероссийского узла:
  # проверено 26.08.2026, api.anthropic.com и api.openai.com отвечают 401
  # (то есть пускают) через все узлы подписки A, включая те, что Google
  # считает российскими.
  #
  # Пока обе задачи решала одна группа AI, узкий и хрупкий список под Google
  # управлял выходом и для Claude: когда закреплённый узел умирал (так вышло
  # с Netherlands Lt 1), вместе с Gemini отваливались Claude и ChatGPT.
  # Разделение убирает эту связь: смерть узла в Google-выходе больше не
  # касается остальных сервисов.

  # Автовыбор среди узлов, которые Google считает нероссийскими.
  #
  # Белый список, а не чёрный: Google относит IP к странам произвольно, и по
  # названию узла предсказать вердикт нельзя — Poland n1 и n2 для него
  # российские, а n3, n4, n6, n7 нет, при одном провайдере и одной стране в
  # имени. Проверено перебором 26.08.2026: из живых узлов подписки A годны
  # шесть — четыре польских (~85 мс, Google видит PL), India (168 мс, IN) и
  # Singapore (276 мс, US). Netherlands Lt 1 в списке седьмым: утром он был
  # годен (NL), к вечеру умер; fallback мёртвые пропускает, так что пусть
  # лежит запасным. Из 88 узлов подписки B живы 14, и все, кроме трёх
  # американских, для Google российские — включая немецкие и шведские, про
  # которые раньше думали обратное. Американские не взяты намеренно: 570-630 мс
  # и Gemini на них отдаёт обрезанный ответ вместо страницы.
  #
  # Список стареет при любой замене или переименовании узлов у провайдера.
  # Обновить: ruby scripts/probe-google.rb — он опрашивает Google через
  # каждый узел и печатает готовую строку filter.
  #
  # fallback, а не url-test: url-test гонится за скоростью и переключал бы
  # узел каждые 120 секунд прямо посреди диалога — для Google это смена
  # страны в рамках одной сессии и повод снова показать заглушку. fallback
  # держится за первый живой узел по порядку и меняет его только при смерти.
  # Порядок здесь — порядок узлов в подписке: сначала польские (~85 мс),
  # India, Singapore и Lt 1 идут после и включаются только если польские умрут.
  # lazy: false — иначе группа не знает, какие узлы живы, до первого запроса,
  # и первый же диалог уходит в мёртвый узел.
  - name: Google-выход
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 60
    lazy: false
    # Свой узел стоит первым: fallback держится за него, пока он жив, и
    # уходит в подписочный белый список только если VPS умрёт. Ручной
    # список ниже поэтому больше не критичен, но остаётся страховкой.
    proxies: [Свой узел]
    use: [subscription]
    filter: "(?i)(Poland n[3467]|India|Singapore|Netherlands Lt 1)"
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png

  # Вся сессия Google: поиск, аккаунты, Gemini, gstatic, аватарки.
  - <<: *select
    name: Google
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google.png
    proxies: [Google-выход, Свой узел, Свободный интернет, Подписка, DIRECT]

  # Claude, ChatGPT и остальные AI, кроме Google. Здесь белый список не нужен:
  # ограничение только одно — не российский IP, а его уже держит
  # «Свободный интернет» своим exclude-filter.
  - <<: *select
    name: AI
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png
    proxies: [Свой узел, Свободный интернет, Подписка, DIRECT]

  - <<: *select
    name: Twitter
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png

  - <<: *select
    name: TikTok
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/tiktok.png

  - <<: *select
    name: PlayStation
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/PlayStation.png

  - <<: *select
    name: Nintendo
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Nintendo.png

  - <<: *select
    name: LG
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_TV.png

  - <<: *select
    name: TCL
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_TV.png

  - <<: *select
    name: Steam
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png

  - <<: *select
    name: Steam (чат и голос)
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png

  - <<: *select
    name: Epic Games
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Epic_Games.png

  - <<: *select
    name: EA
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: Ubisoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: Mihoyo
    icon: https://raw.githubusercontent.com/clash-verge-rev/icon-hub/main/mihoyo/ys.png

  - <<: *select
    name: Игры (прокси)
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: OTHERS
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  # Служебная группа: глушит QUIC, чтобы трафик откатился на TLS.
  # Без `use`, поэтому шаблон *select не подходит.
  - name: QUIC
    type: select
    icon: https://github.com/zxc-rv/assets/raw/refs/heads/main/group-icons/quic.png
    proxies: [REJECT, PASS]

# ══════════════════════════════════════════════════════════════════════
# ПОДПИСКА
#
# Одна. Вторая (префикс «[B] ») убрана 27.08.2026 как лишняя: свой узел
# закрывает то, ради чего держали второй источник. Её ссылка осталась в
# .secrets.yaml под ключом SUB_B — файл локальный, а других копий нет.
#
#   path             файл кэша; при добавлении второй подписки он обязан быть
#                    другим, иначе провайдеры перезапишут файл друг друга;
#   additional-prefix помечает узлы «[A] », чтобы они не путались с узлами
#                    своего сервера, описанными в proxies:.
# ══════════════════════════════════════════════════════════════════════
proxy-providers:
  subscription:
    <<: *provider
    url: ${SUB_A}
    path: ./proxy-providers/subscription.yaml
    override:
      additional-prefix: "[A] "


# ══════════════════════════════════════════════════════════════════════
# RULE-PROVIDER'Ы
#
# Новый провайдер — четыре строки (шаблон задаёт type/behavior/format/interval):
#
#   имя:
#     <<: *mrs-domain
#     url: https://…/что-то.mrs
#     path: ./rule-providers/что-то.mrs
#
# Шаблон выбирается по формату источника:
#   *mrs-domain      .mrs со списком доменов
#   *mrs-ipcidr      .mrs со списком IP-подсетей
#   *yaml-domain     .yaml, плоский список доменов
#   *yaml-classical  .yaml с готовыми правилами
#   *inline          правила прямо здесь, в payload
#
# Имя провайдера — то, что пишется в RULE-SET,<имя>,<группа>.
# ══════════════════════════════════════════════════════════════════════
rule-providers:
  # ── Собственные списки из этого репозитория ───────────────────────
  # Правятся в rules/*.yaml, роутер подтягивает их с raw.githubusercontent.
  # После push изменения приезжают в течение interval (сутки).
  kino:
    <<: *yaml-domain
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/kino.yaml
    path: ./rule-providers/kino-domains.yaml

  AI-custom:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/AI.yaml
    path: ./rule-providers/ai-custom.yaml

  lg:
    <<: *yaml-classical
