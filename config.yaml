log-level: error
allow-lan: true
redir-port: 1080
tproxy-port: 1081
ipv6: false
mode: rule

# Задержка мерится без первого рукопожатия: иначе url-test сравнивает узлы
# нечестно — у транспортов разная цена установки соединения, и XHTTP с Vision
# на одном и том же сервере давали бы разные числа при равной скорости.
unified-delay: true
# Соединение устанавливается ко всем адресам домена разом, побеждает первый
# ответивший. Заметно на доменах с записями в нескольких сетях.
tcp-concurrent: true
# Сопоставление трафика с процессами на роутере бессмысленно — трафик не
# локальный, — а процессор оно тратит. Выключено явно, а не по умолчанию.
find-process-mode: off
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false
external-controller: 0.0.0.0:9090
external-ui: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-selected: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  # Бэкенды LXC 105/106 (youvpn-xray, sub2-xray) не сниффить (исключение на случай попадания в xkeen).
  skip-src-address:
    - ${YOUVPN_XRAY_IP}/32
    - ${SUB2_XRAY_IP}/32
  # Свой узел исключён из сниффинга. Иначе parse-pure-ip плюс TLS-сниффер на
  # 443 разбирают ClientHello соединения к голому IP узла, видят там SNI
  # www.samsung.com (маскировка Reality) и подменяют адресат на настоящий
  # www.samsung.com. Телефон или ноутбук в LAN, подключённый к узлу напрямую,
  # получает в ответ подлинный сертификат донора и падает с
  # «REALITY authentication failed» при исправном узле.
  # На сам роутер это не влияло: свои исходящие подключения он не сниффит.
  skip-dst-address:
    # Свой узел (отключён 19.11.2026; раскомментировать при восстановлении):
    # - ${NODE_S_IP}/32
    # Рабочие стенды. Их имена есть только в /etc/hosts клиента, публичный DNS
    # их не знает. Сниффер брал имя из Host/SNI и подменял им адресат, роутер
    # резолвил имя сам, не находил — и соединение на 80/443 рвалось без ответа
    # («Empty reply from server»), хотя по голому IP тот же сервер отвечал.
    - ${WORK_STAND_A_IP}/32
    - ${WORK_STAND_B_IP}/32
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true

# DNS используется, когда для группы выбран выход «Перевал (DNS)» (type: direct).
# Пока группа смотрит в туннель (Подписка 1/2, Amnezia, Автовыбор), имя домена
# уезжает на удалённый сервер и этот блок не участвует. Когда выбран
# «Перевал (DNS)», mihomo резолвит домены нейросетей и Google через DNS
# Перевала (153.80.200.170) и соединяется с его SNI-прокси напрямую.
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 127.0.0.1
  nameserver:
    - 127.0.0.1
  nameserver-policy:
    "geosite:google,category-ai-!cn":
      - 153.80.200.170
      - https://free.pereval.top/dns-query
    "+.antigravity.google,+.antigravity-unleash.goog,+.cursor.com,+.cursor.sh,+.cursorapi.com,+.windsurf.com,+.codeium.com,+.openrouter.ai,+.groq.com,+.deepl.com,+.jetbrains.com,+.x.ai,+.grok.com,+.githubcopilot.com":
      - 153.80.200.170
      - https://free.pereval.top/dns-query

# ══════════════════════════════════════════════════════════════════════
# ШАБЛОНЫ
#
# Ключ x-templates mihomo не читает — он существует только как источник
# YAML-якорей для блоков ниже. Повторяющиеся поля описаны здесь один раз,
# а группы и rule-provider'ы подключают их через merge-ключ `<<: *якорь`.
# Любое поле после `<<:` переопределяет унаследованное значение.
#
# Как добавить группу:      см. комментарий над proxy-groups
# Как добавить rule-provider: см. комментарий над rule-providers
# ══════════════════════════════════════════════════════════════════════
x-templates:
  # Группа: компактный ручной выбор из верхнеуровневых выходов.
  select: &select
    type: select
    proxies: [Прокси по умолчанию, Подписка 1, Подписка 2, Amnezia, Автовыбор, Перевал (DNS), DIRECT]

  # Подписка: общие поля, различаются только url, path и префикс имён.
  # Автопроверки провайдеров отключены: ~75 узлов, проверяемых пачкой с двух
  # LXC, сами нажимают сигнал ТСПУ «больше трёх параллельных TLS к одному
  # имени». Задержка узлов — вручную из панели; автоматика только в «Автовыбор».
  provider: &provider
    type: http
    interval: 3600
    health-check:
      enable: false
      url: https://cp.cloudflare.com/generate_204
      expected-status: 204

  # Группа: ручной выбор узла внутри одной подписки, без автопроверок.
  # Семейство nv (блокируется Google петлёй GOOGLE_ABUSE) и российские выходы
  # (🇷🇺) исключены из списка.
  sub-test: &sub-test
    type: select
    exclude-filter: "(?i)(nv [0-9]|\U0001F1F7\U0001F1FA)"

  # rule-provider: скомпилированный .mrs со списком доменов.
  mrs-domain: &mrs-domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400

  # rule-provider: скомпилированный .mrs со списком IP-подсетей.
  mrs-ipcidr: &mrs-ipcidr
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400

  # rule-provider: .yaml, плоский список доменов (payload: - example.com).
  yaml-domain: &yaml-domain
    type: http
    behavior: domain
    format: yaml
    interval: 86400

  # rule-provider: .yaml, полноценные правила (payload: - DOMAIN-SUFFIX,…).
  yaml-classical: &yaml-classical
    type: http
    behavior: classical
    format: yaml
    interval: 86400

  # rule-provider: правила прямо в этом файле, без загрузки.
  inline: &inline
    type: inline
    behavior: classical
    format: text

# ══════════════════════════════════════════════════════════════════════
# ГРУППЫ
#
# Новая группа — три строки:
#
#   - <<: *select
#     name: Название
#     icon: https://…/icon.png
#
# Название затем указывается как цель правила в блоке rules.
# Чтобы изменить список запасных вариантов, допишите своё поле proxies —
# оно перекроет значение из шаблона (пример: Cloudflare ниже).
# ══════════════════════════════════════════════════════════════════════
# СВОЙ УЗЕЛ
#   Прописан здесь, а не подпиской: подписка с самого узла требовала на нём
#   nginx с настоящим доменом и сертификатом, а замер 27.08.2026 показал, что
#   честное имя в SNI душат на первом окне TCP. Весь тот слой снесён.
#
#   Два входа на одном сервере с РАЗНЫМИ донорами: если одно имя начнут
#   душить, второй вход продолжает работать. Проверено замером — оба отдают
#   10 МБ на 12-13 МБ/с, см. node/README.md.
#
#   Реквизиты подставляются smudge-фильтром из .secrets.yaml, в коммит уходят
#   плейсхолдеры. Обновляются командой ./node/bin/client show router.
# ══════════════════════════════════════════════════════════════════════
proxies:
  # ОТКЛЮЧЁН 19.11.2026 (хвост для восстановления).
  # Чтобы вернуть свой узел: раскомментируйте узлы ниже, группу «Свой узел»,
  # IP в sniffer.skip-dst-address и правило IP-CIDR в rules:, а также добавьте
  # «Свой узел» обратно в *select / «Прокси по умолчанию» / Google.
  # Ключи NODE_S_* сохранены в .secrets.yaml, скрипты — в node/.
  #
  # - name: Свой узел XHTTP
  #   type: vless
  #   server: ${NODE_S_IP}
  #   port: 443
  #   uuid: ${NODE_S_UUID}
  #   udp: true
  #   packet-encoding: xudp
  #   tls: true
  #   network: xhttp
  #   alpn: [h2]
  #   servername: www.samsung.com
  #   client-fingerprint: firefox
  #   reality-opts:
  #     public-key: ${NODE_S_PBK_X}
  #     short-id: ${NODE_S_SID_X}
  #   xhttp-opts:
  #     path: ${NODE_S_PATH}
  #     mode: stream-one
  #
  # - name: Свой узел Vision
  #   type: vless
  #   server: ${NODE_S_IP}
  #   port: 2096
  #   uuid: ${NODE_S_UUID}
  #   udp: true
  #   packet-encoding: xudp
  #   tls: true
  #   flow: xtls-rprx-vision
  #   network: tcp
  #   servername: www.nvidia.com
  #   client-fingerprint: firefox
  #   reality-opts:
  #     public-key: ${NODE_S_PBK_V}
  #     short-id: ${NODE_S_SID_V}

  # Резидентский прокси proxy.market, Турция, только для PlayStation: домашний
  # турецкий IP вместо дата-центра. Порт из диапазона 10000-10999 задаёт
  # сессию, но адрес у сессии плавает: 13.10.2026 на 10000 был сначала Türk
  # Telekom в Стамбуле, вечером — в Анкаре. Тариф пробный: 100 МБ до
  # 12.11.2026 — на закачку игр не хватит, подробнее в README.
  #
  # Реквизиты здесь остаются плейсхолдерами и в рабочем файле: их подставляет
  # scripts/deploy при отправке на роутер.
  - name: Турция (резидентский)
    type: socks5
    server: ${TR_RES_SERVER}
    port: 10000
    username: ${TR_RES_USER}
    password: ${TR_RES_PASS}
    udp: true

  # Amnezia Premium, Германия: AmneziaWG версии 3 (с HeaderProtectionKey).
  # Конфиг выгружен из приложения 19.11.2026 отдельным устройством для
  # роутера — тем же ключом с другого устройства не подключаться, иначе
  # соединение рвётся у обоих. Поля v3 mihomo понимает не с любой сборки:
  # в v1.19.24 их нет, в v1.19.30 уже есть.
  - name: Amnezia DE
    type: wireguard
    server: ${AWG_DE_SERVER}
    port: 8344
    ip: 100.109.116.32
    private-key: ${AWG_DE_PRIVATE_KEY}
    public-key: ${AWG_DE_PUBLIC_KEY}
    pre-shared-key: ${AWG_DE_PSK}
    allowed-ips: ['0.0.0.0/0']
    udp: true
    mtu: 1280
    persistent-keepalive: 25
    remote-dns-resolve: true
    dns: [100.64.0.1, 8.8.4.4]
    amnezia-wg-option:
      version: 3
      jc: 5
      jmin: 10
      jmax: 80
      s1: 461
      s2: 22
      s3: 145
      s4: 12
      h1: "1"
      h2: "2"
      h3: "3"
      h4: "4"
      i1: "<b 0x000100002112a442><r 12>"
      i2: "<b 0x000300082112a442><r 12><b 0x0019000411000000>"
      header-protection-key: ${AWG_DE_HPK}
      content-padding-addition: "10-100"
      rekey-after-time: "100-120"
      rekey-timeout: "3-8"
      reject-after-time: "150-180"
      keepalive-timeout: "7-13"
      max-handshake-attempts: "15-20"

  # Запасной выход для нейросетей и Google через бесплатный Smart DNS «Перевал»
  # (https://pereval.top). Резолвит домены из dns.nameserver-policy через
  # 153.80.200.170 и отправляет TLS-трафик напрямую на SNI-прокси Перевала.
  - name: Перевал (DNS)
    type: direct

  # Первая подписка (YouVPN) подтягивается динамически через proxy-providers.sub1
  # с Xray-бэкенда (LXC 105, ${YOUVPN_XRAY_IP}:8389/sub1.yaml) в виде лёгких socks5-портов.
# ══════════════════════════════════════════════════════════════════════
proxy-groups:
  # РУБИЛЬНИК. Стоит первым в панели и первым вариантом в шаблоне *select,
  # поэтому все сервисные группы по умолчанию смотрят сюда, а не на
  # конкретный выход. Смысл: переключить весь трафик между группами узлов
  # одним движением, не обходя тридцать групп руками.
  #
  # У Google свой выбор выхода, потому что Gemini сверяет страну по сессии целиком.
  - name: Прокси по умолчанию
    type: select
    proxies: [Подписка 1, Подписка 2, Amnezia, Автовыбор, Перевал (DNS), DIRECT]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png

  # Хвост для восстановления «Свой узел» (отключён 19.11.2026):
  # - name: Свой узел
  #   type: url-test
  #   url: https://cp.cloudflare.com/generate_204
  #   expected-status: 204
  #   interval: 120
  #   tolerance: 100
  #   lazy: false
  #   proxies: [Свой узел XHTTP, Свой узел Vision]
  #   icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  # ── Группы узлов: Подписка 1, Подписка 2, Amnezia, Автовыбор ──────
  # Первая подписка: динамически подтягивается с Xray-бэкенда (LXC 105, ${YOUVPN_XRAY_IP}).
  # Ручной выбор; торрент-, «белые списки» и RU-профили скрыты.
  - name: Подписка 1
    type: select
    exclude-filter: "(?i)(Торрент|Белые списки|YouVPN RU)"
    use: [sub1]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  # Вторая подписка: ручной выбор узла (без семейства nv и РФ).
  - <<: *sub-test
    name: Подписка 2
    use: [sub2]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  # Отдельная группа для серверов Amnezia (новые серверы добавлять в proxies:
  # и в этот список). Ручной выбор; автоматический резерв — в «Автовыбор».
  - name: Amnezia
    type: select
    proxies: [Amnezia DE]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png

  # Автовыбор — единственная группа с автопроверками. Резерв, а не гонка
  # за пингом: держит первый живой выход в порядке Подписка 1 -> Amnezia ->
  # Подписка 2 и уходит дальше только при отказе. Проверяет три группы, а
  # внутри каждой — только выбранный в ней узел, поэтому пачки параллельных
  # TLS (сигнал ТСПУ) не возникает. lazy: проверки только при трафике.
  # Amnezia в середине не зависит от Proxmox: если упадут LXC 105/106,
  # трафик уйдёт в WireGuard прямо с роутера.
  - name: Автовыбор
    type: fallback
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 120
    lazy: true
    proxies: [Подписка 1, Amnezia, Подписка 2]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png

  # ── Сервисные группы ─────────────────────────────────────────────

  - <<: *select
    name: YouTube
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png

  - <<: *select
    name: Discord
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Discord.png


  - <<: *select
    name: Кинотеатры
    icon: https://github.com/amatol/xkeen-configuration/raw/refs/heads/main/group-icons/kino.png

  - <<: *select
    name: Meta
    icon: https://github.com/zxc-rv/assets/raw/refs/heads/main/group-icons/meta.png

  - <<: *select
    name: Microsoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png

  - <<: *select
    name: Spotify
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png

  - <<: *select
    name: Telegram
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png



  # PASS — передать решение следующему правилу вместо отправки в прокси.
  - <<: *select
    name: Cloudflare
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Cloudflare.png
    proxies: [PASS, Прокси по умолчанию, Подписка 1, Подписка 2, Amnezia, Автовыбор, Перевал (DNS), DIRECT]

  # Вся сессия Google (поиск, аккаунты, Gemini, gstatic, аватарки).
  # Gemini сверяет страну по сессии целиком, поэтому здесь можно закрепить
  # отдельный узел любой подписки, не трогая общие группы.
  - <<: *select
    name: Google
    use: [sub1, sub2]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google.png

  # Claude, ChatGPT и остальные AI, кроме Google: фиксированный ручной выбор
  # из всех доступных узлов и групп.
  - name: AI
    type: select
    proxies: [Прокси по умолчанию, Подписка 1, Подписка 2, Amnezia, Автовыбор, Перевал (DNS), DIRECT]
    use: [sub1, sub2]
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png

  - <<: *select
    name: Twitter
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png


  # Турция первой: группа по умолчанию идёт через неё, остальное — запас.
  - <<: *select
    name: PlayStation
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/PlayStation.png
    proxies: [Турция (резидентский), Прокси по умолчанию, Подписка 1, Подписка 2, Amnezia, Автовыбор, Перевал (DNS), DIRECT]

  - <<: *select
    name: Nintendo
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Nintendo.png

  - <<: *select
    name: LG
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_TV.png

  - <<: *select
    name: TCL
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple_TV.png

  - <<: *select
    name: Steam
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png

  - <<: *select
    name: Steam (чат и голос)
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png

  - <<: *select
    name: Epic Games
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Epic_Games.png

  - <<: *select
    name: EA
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: Ubisoft
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png


  - <<: *select
    name: Игры (прокси)
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png

  - <<: *select
    name: OTHERS
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png

  # Служебная группа: глушит QUIC, чтобы трафик откатился на TLS.
  # Без `use`, поэтому шаблон *select не подходит.
  - name: QUIC
    type: select
    icon: https://github.com/zxc-rv/assets/raw/refs/heads/main/group-icons/quic.png
    proxies: [REJECT, PASS]

# ══════════════════════════════════════════════════════════════════════
# ПОДПИСКИ
#
# Слоты sub1 («Подписка 1», YouVPN, без префикса — имена и так «YouVPN …»)
# и sub2 («Подписка 2», ProstoKosmos, префикс «[2] »). Оба отдаются Xray-
# бэкендами LXC 105/106 в виде socks5-портов; адреса — в .secrets.yaml под
# ключами SUB_1 и SUB_2, исходная ссылка ProstoKosmos — SUB_2_UPSTREAM.
#
#   path              файл кэша; у каждой подписки свой, иначе провайдеры
#                     перезапишут файл друг друга;
#   additional-prefix помечает узлы «[2] », чтобы они не путались с узлами
#                     первой подписки и из proxies:.
# ══════════════════════════════════════════════════════════════════════
proxy-providers:
  sub1:
    <<: *provider
    url: ${SUB_1}
    path: ./proxy-providers/sub1.yaml

  sub2:
    <<: *provider
    url: ${SUB_2}
    path: ./proxy-providers/sub2.yaml
    override:
      additional-prefix: "[2] "

# ══════════════════════════════════════════════════════════════════════
# RULE-PROVIDER-Ы
#
# Доменные списки сервисов (YouTube, Google, Spotify, Steam, PlayStation и др.)
# берутся напрямую из встроенной базы GeoSite.dat (GEOSITE,<имя>), чтобы не
# плодить десятки отдельных .mrs-загрузок. Здесь объявлены только:
#   1. собственные списки из папки rules/*.yaml этого репозитория;
#   2. IP-подсети (telegram, meta, cloudflare);
#   3. реестр РКН (re:filter) и списки торрентов;
#   4. составное правило Discord (домены + голосовые UDP-порты).
# ══════════════════════════════════════════════════════════════════════
rule-providers:
  # ── Собственные списки из этого репозитория (rules/*.yaml) ────────
  AI-custom:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/AI.yaml
    path: ./rule-providers/ai-custom.yaml

  kino:
    <<: *yaml-domain
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/kino.yaml
    path: ./rule-providers/kino-domains.yaml

  lg:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/lg.yaml
    path: ./rule-providers/lg.yaml

  tcl:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/tcl.yaml
    path: ./rule-providers/tcl.yaml

  games-proxy:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/games-proxy.yaml
    path: ./rule-providers/games-proxy.yaml

  others:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/others.yaml
    path: ./rule-providers/others.yaml

  blocked:
    <<: *yaml-classical
    url: https://raw.githubusercontent.com/Ivan-Stepalin/xkeen-config-mihomo/main/rules/blocked.yaml
    path: ./rule-providers/blocked.yaml

  edge-cache:
    type: file
    behavior: classical
    format: yaml
    path: ./rule-providers/edge-cache.yaml

  # ── IP-подсети (Telegram, Meta, Cloudflare) ───────────────────────
  telegram-ips:
    <<: *mrs-ipcidr
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/telegram.mrs
    path: ./rule-providers/telegram-ips.mrs

  meta-ips:
    <<: *mrs-ipcidr
    url: https://github.com/zxc-rv/assets/raw/refs/heads/main/rules/meta-ips.mrs
    path: ./rule-providers/meta-ips.mrs

  cloudflare-ips:
    <<: *mrs-ipcidr
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cloudflare.mrs
    path: ./rule-providers/cloudflare-ips.mrs

  # ── re:filter (реестр РКН) и торренты, legiz-ru ───────────────────
  refilter-domains:
    <<: *mrs-domain
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/domain-rule.mrs
    path: ./rule-providers/refilter-domains.mrs

  refilter-ips:
    <<: *mrs-ipcidr
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/re-filter/ip-rule.mrs
    path: ./rule-providers/refilter-ips.mrs

  torrent-trackers:
    <<: *mrs-domain
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/torrent-trackers.mrs
    path: ./rule-providers/torrent-trackers.mrs

  torrent-clients:
    <<: *yaml-classical
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/torrent-clients.yaml
    path: ./rule-providers/torrent-clients.yaml

  # ── Составное правило Discord (домены + голосовые порты) ──────────
  discord:
    <<: *inline
    payload:
      - AND,((DOMAIN-KEYWORD,discord),(NOT,((DOMAIN-SUFFIX,ru))))
      - AND,((RULE-SET,cloudflare-ips,no-resolve),(NETWORK,TCP),(OR,((DST-PORT,2000-2300),(DST-PORT,8443))))
      - AND,((RULE-SET,cloudflare-ips,no-resolve),(NETWORK,UDP),(OR,((DST-PORT,19200-19400),(DST-PORT,50000-51000))))
      - AND,((IP-CIDR,5.200.14.128/25,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,34.0.0.0/15,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,34.2.0.0/15,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,35.192.0.0/11,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,66.22.192.0/18,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))
      - AND,((IP-CIDR,138.128.136.0/21,no-resolve),(NETWORK,UDP),(DST-PORT,50000-51000))

# ══════════════════════════════════════════════════════════════════════
# ПРАВИЛА
#
# ПОРЯДОК ЗНАЧИМ: побеждает первое совпадение, остальные не проверяются.
# Проверить порядок и ссылки: ruby scripts/validate.rb
# ══════════════════════════════════════════════════════════════════════
rules:
  # ── Системные ─────────────────────────────────────────────────────
  - SRC-IP-CIDR,${YOUVPN_XRAY_IP}/32,DIRECT,no-resolve
  - SRC-IP-CIDR,${SUB2_XRAY_IP}/32,DIRECT,no-resolve
  # Свой узел (отключён 19.11.2026; раскомментировать при восстановлении):
  # - IP-CIDR,${NODE_S_IP}/32,DIRECT,no-resolve
  - RULE-SET,blocked,REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP)),QUIC

  # ── Google и AI (YouTube выше Google, Google выше общих AI) ───────
  - GEOSITE,youtube,YouTube
  - OR,((GEOSITE,google),(DOMAIN-SUFFIX,clients6.google.com),(DOMAIN-SUFFIX,ogs.google.com),(DOMAIN-SUFFIX,antigravity.google),(DOMAIN-SUFFIX,antigravity-unleash.goog),(DOMAIN-KEYWORD,antigravity)),Google
  - OR,((GEOSITE,category-ai-!cn),(RULE-SET,AI-custom)),AI

  # ── Соцсети, мессенджеры и медиа ──────────────────────────────────
  - RULE-SET,discord,Discord
  - OR,((GEOSITE,telegram),(RULE-SET,telegram-ips,no-resolve)),Telegram
  - OR,((GEOSITE,meta),(RULE-SET,meta-ips,no-resolve)),Meta
  - GEOSITE,twitter,Twitter
  - GEOSITE,spotify,Spotify
  - RULE-SET,kino,Кинотеатры
  - GEOSITE,microsoft,Microsoft

  # ── Телевизоры и консоли ──────────────────────────────────────────
  - RULE-SET,lg,LG
  - RULE-SET,tcl,TCL
  - GEOSITE,playstation,PlayStation
  - OR,((IP-CIDR,172.235.195.23/32,no-resolve),(GEOSITE,nintendo)),Nintendo

  # ── Игры на ПК (чат Steam стоит выше общего правила Steam) ────────
  - OR,((DOMAIN-SUFFIX,steamcommunity.com),(DOMAIN-SUFFIX,steam-chat.com)),Steam (чат и голос)
  - GEOSITE,steam,Steam
  - GEOSITE,epicgames,Epic Games
  - GEOSITE,ea,EA
  - GEOSITE,ubisoft,Ubisoft
  - RULE-SET,games-proxy,Игры (прокси)

  # ── Прочее, Cloudflare, реестр РКН и торренты ─────────────────────
  - RULE-SET,others,OTHERS
  - RULE-SET,edge-cache,Прокси по умолчанию
  - OR,((GEOSITE,cloudflare),(RULE-SET,cloudflare-ips,no-resolve)),Cloudflare
  - OR,((RULE-SET,refilter-domains),(RULE-SET,refilter-ips,no-resolve)),Прокси по умолчанию
  - OR,((RULE-SET,torrent-clients),(RULE-SET,torrent-trackers)),DIRECT
  - MATCH,DIRECT
