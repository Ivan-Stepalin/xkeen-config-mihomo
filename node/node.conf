# Объявление узла. Единственное место, где задаются параметры; скрипты
# ничего не спрашивают и ничего не угадывают. Секретов здесь нет —
# ключи и UUID живут в secrets/ и в git не уходят.

SERVER_NAME=gervps
LOCATION=nbg1            # nbg1 Nuremberg · hel1 Helsinki
SERVER_TYPE=cx23         # 2 vCPU / 4 GB / 20 TiB — €6.49/мес нетто
IMAGE=ubuntu-24.04

SSH_KEY_NAME=aeroclub-mac
SSH_KEY_FILE=$HOME/.ssh/id_ed25519
FIREWALL_NAME=gervps-fw

# Основной вход: XHTTP. Он сворачивает пачку соединений в одно, а ТСПУ с
# июня 2026 морозит на 120 секунд всё, что открывает больше трёх
# параллельных TLS к одному имени за 350-400 мс.
PORT_XHTTP=443

# Запасной вход: классический XTLS-Vision поверх сырого TCP. Держим на
# отдельном порту, потому что именно эту связку массово блокировали у
# проводных операторов РФ — она может не подняться там, где XHTTP пройдёт.
PORT_VISION=2096

# Фингерпринт. chrome помечен как подозрительный на диапазонах хостеров,
# firefox у большинства операторов проходит. Значение должно совпадать с
# client-fingerprint в config.yaml роутера.
FINGERPRINT=firefox

# Доноры для маскировки Reality: узел проксирует туда чужое рукопожатие, и
# это же имя клиент пишет в SNI. Требования: TLS 1.3, ALPN h2, группа
# x25519, валидный публичный сертификат, не CDN, не Google.
#
# Специально держим двух разных доноров на двух входах, чтобы замер из дома
# сам показал, какая ставка верна — гадать тут нечем.
#
# Сосед по подсети: связка «наш IP + это имя» согласована, имя обскурное и
# не засвечено чужими узлами. Подбирается ./bin/scan-sni.
SNI_XHTTP=www.samsung.com

# Крупный сайт: имя засвечено тысячами чужих узлов и живёт в чужой сети, зато
# трафика там столько, что наш в нём растворяется. Подтверждён замером
# 27.08.2026 — 8.4 МБ/с из РФ.
SNI_VISION=www.nvidia.com

# Режим подбора донора: список имён через запятую, которые ./bin/pick-donor
# временно вешает на запасной вход, чтобы замерить их из дома за один деплой.
# В обычном состоянии пусто.
PROBE_SNIS=
