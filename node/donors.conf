# Кандидаты в доноры для маскировки Reality.
#
# Замер 27.08.2026 показал, что обрыв следует за именем в SNI, а не за портом
# и не за транспортом: обскурный сайт из соседней подсети умирал на обоих
# входах, крупный сайт на обоих работал. Отсюда критерий: имя должно быть
# заметным и с большим собственным трафиком, чтобы наш в нём растворялся.
#
# Это противоположность тому, что оптимизируют сканеры вроде
# Reality-SNI-finder: они ранжируют по TLS-задержке и выводят обскурных
# соседей по датацентру, то есть худших доноров из возможных.
#
# Требования, которые проверяет ./bin/pick-donor:
#   TLS 1.3, ALPN h2, группа x25519, валидный публичный сертификат,
#   не Cloudflare, не Google, живой ответ.
#
# Что здесь не должно появляться: имена за Cloudflare (замер 27.08.2026 —
# душат так же, как обскурные), домены Google (узел нужен ради них же),
# и всё, что заблокировано в РФ — заблокированное имя в SNI это гарантированный
# провал.

www.tesla.com
www.microsoft.com
www.nvidia.com
www.samsung.com
www.amd.com
www.icloud.com
www.qualcomm.com
www.intel.com
www.yahoo.co.jp
