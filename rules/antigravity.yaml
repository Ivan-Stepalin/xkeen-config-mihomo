# Antigravity (IDE Google): всё через группу Google
# Политику задаёт RULE-SET,antigravity,Google в config. Антигравити — тот же
# бэкенд Gemini (Cloud Code), и страну он сверяет так же, по сессии целиком,
# поэтому его домены должны выходить тем же узлом, что и остальной Google, а не
# через группу AI.
# behavior: classical, format: yaml
payload:
  # сайт, загрузки, документация, флаги функций (antigravity-unleash.goog)
  - DOMAIN-SUFFIX,antigravity.google
  - DOMAIN-SUFFIX,antigravity-unleash.goog
  - DOMAIN-KEYWORD,antigravity
  # бэкенд агента: cloudcode-pa, daily-cloudcode-pa, daily-cloudcode-pa.sandbox
  - DOMAIN-KEYWORD,cloudcode-pa
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com
  # вход в аккаунт Google из IDE
  - DOMAIN-SUFFIX,oauth2.googleapis.com
  - DOMAIN-SUFFIX,accounts.google.com
